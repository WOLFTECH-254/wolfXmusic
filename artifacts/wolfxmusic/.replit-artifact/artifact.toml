kind = "web"
previewPath = "/"
title = "wolfXmusic"
version = "1.0.0"
id = "artifacts/wolfxmusic"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20193

[services.development]
run = "pnpm --filter @workspace/wolfxmusic run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/wolfxmusic", "run", "build" ]
publicDir = "artifacts/wolfxmusic/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20193"
BASE_PATH = "/"
