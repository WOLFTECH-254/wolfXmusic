<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#00ff00" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#080808" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bottomGlow" cx="50%" cy="100%" r="60%">
      <stop offset="0%" stop-color="#00ff00" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#080808" stop-opacity="0"/>
    </radialGradient>
    <filter id="greenGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#080808"/>
  <rect width="1200" height="630" fill="url(#centerGlow)"/>
  <rect width="1200" height="630" fill="url(#bottomGlow)"/>

  <!-- Subtle grid lines -->
  <g opacity="0.04" stroke="#00ff00" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="150" y1="0" x2="150" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="650" y1="0" x2="650" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1050" y1="0" x2="1050" y2="630"/>
  </g>

  <!-- Top border accent -->
  <rect x="0" y="0" width="1200" height="3" fill="#00ff00" opacity="0.6"/>

  <!-- Small slash accent top-left -->
  <text x="80" y="85" font-family="'Courier New', monospace" font-size="18" fill="#00ff00" opacity="0.5" letter-spacing="4">// STREAM ANYTHING</text>

  <!-- Main logotype -->
  <text x="80" y="360" font-family="'Arial Black', 'Impact', sans-serif" font-size="180" font-weight="900" filter="url(#softGlow)">
    <tspan fill="#00ff00" filter="url(#greenGlow)">wolf</tspan><tspan fill="#555555">X</tspan><tspan fill="#ffffff">music</tspan>
  </text>

  <!-- Tagline -->
  <text x="82" y="420" font-family="'Courier New', monospace" font-size="22" fill="#333333" letter-spacing="6">Discover · Search · Stream · Download</text>

  <!-- Waveform bars — bottom decorative -->
  <g opacity="0.5">
    <rect x="80"  y="530" width="8" height="60" rx="4" fill="#00ff00"/>
    <rect x="96"  y="550" width="8" height="40" rx="4" fill="#00ff00"/>
    <rect x="112" y="518" width="8" height="72" rx="4" fill="#00ff00"/>
    <rect x="128" y="542" width="8" height="48" rx="4" fill="#00ff00"/>
    <rect x="144" y="525" width="8" height="65" rx="4" fill="#00ff00"/>
    <rect x="160" y="555" width="8" height="35" rx="4" fill="#00ff00" opacity="0.6"/>
    <rect x="176" y="540" width="8" height="50" rx="4" fill="#00ff00" opacity="0.4"/>
    <rect x="192" y="560" width="8" height="30" rx="4" fill="#00ff00" opacity="0.2"/>
  </g>

  <!-- Bottom border accent -->
  <rect x="0" y="627" width="1200" height="3" fill="#00ff00" opacity="0.3"/>

  <!-- Version dot -->
  <circle cx="1140" cy="590" r="4" fill="#00ff00" opacity="0.4"/>
  <text x="1108" y="608" font-family="'Courier New', monospace" font-size="14" fill="#333" text-anchor="middle">wolfxmusic.app</text>
</svg>
