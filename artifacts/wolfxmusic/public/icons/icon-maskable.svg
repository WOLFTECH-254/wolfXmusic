<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Full bleed background for maskable — safe zone is center 80% (≈ 102..410) -->
  <defs>
    <radialGradient id="mg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#00ff00" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#080808" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="#080808"/>
  <rect width="512" height="512" fill="url(#mg)"/>
  <!-- Top accent inside safe zone -->
  <rect x="102" y="110" width="308" height="5" rx="2.5" fill="#00ff00" opacity="0.6"/>
  <!-- wX centered in safe zone -->
  <text x="256" y="320" text-anchor="middle" font-family="'Arial Black','Impact',sans-serif" font-size="180" font-weight="900">
    <tspan fill="#00ff00">w</tspan><tspan fill="#555">X</tspan>
  </text>
  <!-- Bottom accent inside safe zone -->
  <rect x="102" y="395" width="308" height="5" rx="2.5" fill="#00ff00" opacity="0.3"/>
</svg>
