<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#00ff00" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="0"/>
    </radialGradient>
    <filter id="g">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="400" height="400" fill="#0a0a0a"/>
  <rect width="400" height="400" fill="url(#glow)"/>

  <!-- Top accent line -->
  <rect x="0" y="0" width="400" height="2" fill="#00ff00" opacity="0.7"/>

  <!-- wXm logotype -->
  <text x="200" y="215" text-anchor="middle" font-family="'Arial Black','Impact',sans-serif" font-size="100" font-weight="900" filter="url(#g)">
    <tspan fill="#00ff00">w</tspan><tspan fill="#555">X</tspan><tspan fill="#fff">m</tspan>
  </text>

  <!-- Tagline -->
  <text x="200" y="255" text-anchor="middle" font-family="'Courier New',monospace" font-size="13" fill="#333" letter-spacing="4">wolfXmusic</text>

  <!-- Waveform bars bottom -->
  <g opacity="0.45">
    <rect x="148" y="305" width="6" height="40" rx="3" fill="#00ff00"/>
    <rect x="160" y="318" width="6" height="27" rx="3" fill="#00ff00"/>
    <rect x="172" y="298" width="6" height="47" rx="3" fill="#00ff00"/>
    <rect x="184" y="310" width="6" height="35" rx="3" fill="#00ff00"/>
    <rect x="196" y="302" width="6" height="43" rx="3" fill="#00ff00"/>
    <rect x="208" y="320" width="6" height="25" rx="3" fill="#00ff00" opacity="0.7"/>
    <rect x="220" y="312" width="6" height="33" rx="3" fill="#00ff00" opacity="0.5"/>
    <rect x="232" y="325" width="6" height="20" rx="3" fill="#00ff00" opacity="0.3"/>
    <rect x="244" y="315" width="6" height="30" rx="3" fill="#00ff00" opacity="0.15"/>
  </g>

  <!-- Bottom accent line -->
  <rect x="0" y="398" width="400" height="2" fill="#00ff00" opacity="0.3"/>
</svg>
